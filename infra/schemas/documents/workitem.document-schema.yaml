$schema: https://document-schema.org/draft/2026-06/schema
maxTokens: 1500
frontmatter:
  type: object
  required: [type, title, description, status]
  properties:
    type:
      enum: [plan, task]
    title:
      type: string
      pattern: \S
      maxLength: 160
    description:
      type: string
      pattern: \S
      maxLength: 240
    status:
      enum: [backlog, in-progress, blocked, done, closed]
    links:
      type: array
      items:
        type: string
        pattern: \S
      uniqueItems: true
    resolution:
      type: object
      properties:
        reason:
          type: string
          pattern: \S
sections:
- header:
    pattern: ^\S
  minContains: 1
  maxContains: 1
  sections:
  - header:
      const: Goal
    minContains: 1
    maxContains: 1
  - header:
      const: Acceptance
    minContains: 1
    maxContains: 1
