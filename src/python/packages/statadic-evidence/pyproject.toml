[project]
name = "statadic-evidence"
version = "0.1.0"
description = "Internal deterministic evidence files and safe archives"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2", "ruff>=0.16,<0.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/statadic_evidence"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
