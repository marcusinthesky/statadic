[project]
name = "statadic-publishing"
version = "0.1.0"
description = "Local reproducible research publishing"
requires-python = ">=3.13,<3.14"
dependencies = ["jax[cpu]>=0.11.0,<0.12", "statadic[data]", "statadic-evidence", "tomli-w>=1.2,<2"]

[dependency-groups]
dev = ["pyrefly>=1.4,<1.5", "pytest==8.4.2", "ruff>=0.16,<0.17"]
reference = ["statsmodels>=0.14.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/statadic_publishing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requires_optional(name): requires an optional reference dependency"]

[tool.uv.sources]
statadic = { workspace = true }
statadic-evidence = { workspace = true }
