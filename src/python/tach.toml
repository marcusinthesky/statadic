# Scientific module ownership and supported cross-family interfaces.
# Nested ownership separates taxonomy from dependency direction: ground geometry
# can feed discrepancy families which feed geometric barycentres. Lightweight
# namespace initializers have no outgoing family dependencies.
source_roots = [
  "packages/statadic/src", "packages/statadic-evidence/src", "packages/statadic-publishing/src", "apps/studies/src",
  "apps/performance/src", "apps/docs/src",
]
exclude = ["**/tests/**"]
root_module = "forbid"
exact = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false
include_string_imports = true

# Tach checks within packages. The architecture script owns cross-package rules.
[[modules]]
paths = ["statadic_evidence", "statadic_publishing", "statadic_studies", "statadic_performance", "statadic_docs_labs", "statadic_docs_pages"]
depends_on = []

