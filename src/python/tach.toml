expose = ["_WEAK_IDENTIFICATION_THRESHOLD"]
visibility = ["statadic.inference.kappa"]

[[interfaces]]
from = ["statadic.inference._parameter_reference"]
expose = [
  "_MAX_VALIDATED_DEGREES",
  "_outside_validated_range",
  "_f_survival",
  "_student_critical_value"
]
visibility = ["statadic.inference.parameters", "statadic.inference.linear_diagnostics"]

[[interfaces]]
from = ["statadic.inference._projection"]
expose = ["PROJECTION_TOLERANCE", "refine_projection_solution"]
visibility = ["statadic.inference.gms", "statadic.inference.wolak"]

[[interfaces]]
from = ["statadic.inference._projection"]
expose = ["POLISH_ROUNDS"]
visibility = ["statadic.inference.wolak"]

[external]
# Tach check-external does not resolve optional extras/dev-only fixture imports.
# Exclusions are global; see scripts/architecture/README.md for their scope.
exclude = ["pytest", "polars", "pyarrow", "matplotlib", "pyrefly_shape_extensions"]
# The stubs' import name has no runtime module metadata. Tach matches the
# normalized distribution identifier after this explicit mapping.
rename = ["shape_extensions:pyrefly-shape-extensions"]

# Public inference modules re-export the projection failure callers can catch.
[[interfaces]]
from = ["statadic.inference._common"]
expose = ["ProjectionUnavailableError"]
visibility = ["statadic.inference.gms", "statadic.inference.wolak"]

[rules]
require_ignore_directive_reasons = "error"
unused_ignore_directives = "error"
unused_external_dependencies = "warn"

# These consumers retain implementation-source identity as evidence.
[[interfaces]]
from = ["statadic"]
expose = ["__file__"]
visibility = [
  "statadic_performance.worker", "statadic_studies.campaign", "statadic_studies.source",
  "statadic_performance.reference_worker", "statadic_docs_labs.consumer_fixtures",
]

# Internal host helpers shared only by the workflows that consume them.
[[interfaces]]
from = ["statadic.api.inputs"]
expose = ["_validate_duplicate_predictors"]
visibility = ["statadic.api.panel"]

[[interfaces]]
from = ["statadic.api.inputs"]
expose = ["_node_predictor", "_matching_predictor"]
visibility = ["statadic.api.survival"]

[[interfaces]]
from = ["statadic.api.reporting"]
expose = ["_finite_metric"]
visibility = ["statadic.api.panel", "statadic.api.regression", "statadic.api.spatial", "statadic.api.survival"]

[[interfaces]]
from = ["statadic.api.data"]
expose = ["_check_array_precision"]
visibility = ["statadic.api.artifacts", "statadic.api.inputs"]

[[interfaces]]
from = ["statadic.api.data"]
expose = ["_numeric_column"]
visibility = ["statadic.api.inputs"]

[[interfaces]]
from = ["statadic.api.data"]
expose = ["_label_values"]
visibility = ["statadic.api.tables", "statadic.api.comparison"]

[[interfaces]]
from = ["statadic.estimation.dyadic"]
expose = ["solve._least_squares_host"]
visibility = ["statadic.inference.dyadic"]

[[interfaces]]
from = ["statadic.model.dyadic"]
expose = ["validation._array_shape", "validation._is_finite_real_array", "validation._validate_sample"]
visibility = ["statadic.inference.dyadic"]

[[interfaces]]
from = ["statadic.model.dyadic"]
expose = ["validation._validate_design_inputs", "validation._validate_model"]
visibility = ["statadic.estimation.dyadic"]

[[interfaces]]
from = [
  "statadic.api",
  "statadic.api.regression",
  "statadic.api.spatial.graphs",
  "statadic.api.spatial.learning",
  "statadic.api.spatial.selection",
  "statadic.api.spatial.resampling",
  "statadic.api.spatial.graphs",
  "statadic.api.base",
  "statadic.api.capabilities",
  "statadic.api.estimand",
  "statadic.api.inference",
  "statadic.api.diagnostics",
  "statadic.api.hypotheses",
  "statadic.api.data",
  "statadic.api.tables",
  "statadic.api.inputs",
  "statadic.api.roles",
  "statadic.api.prediction",
  "statadic.api.plots",
  "statadic.api.representation",
  "statadic.api.design",
  "statadic.api.regression",
  "statadic.api.panel",
  "statadic.api.spatial",
  "statadic.api.survival",
  "statadic.api.moments",
  "statadic.api.comparison",
  "statadic.api.association",
  "statadic.api.covariance",
  "statadic.api.dyadic",
  "statadic.api.reporting",
  "statadic.api.artifacts"
]
expose = ["[A-Za-z][A-Za-z0-9_]*"]


# Composition selects internal native backends. The predictor codec shares the
# fitted design and roster machinery with the graph model it reconstructs.
[[interfaces]]
from = ["statadic.api.spatial"]
expose = [
  "cross_section.[A-Za-z][A-Za-z0-9_]*",
  "graph_regression.[A-Za-z][A-Za-z0-9_]*",
  "observed.[A-Za-z][A-Za-z0-9_]*",
  "panel.[A-Za-z][A-Za-z0-9_]*",
  "prediction.[A-Za-z][A-Za-z0-9_]*",
]

[[interfaces]]
from = ["statadic.api.spatial"]
expose = [
  "cross_section._SpatialRegressionBackend",
  "graph_regression._prepare_graph_regression",
  "observed._ObservedSpatialPanelBackend",
  "panel._SpatialPanelBackend",
]
