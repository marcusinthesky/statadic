[project]
name = "statadic-studies"
version = "0.1.0"
description = "Internal reproducible statistical experiments for STATADIC"
requires-python = ">=3.13,<3.14"
dependencies = ["statadic", "statadic-evidence", "numpy>=2,<3", "jax[cpu]>=0.11,<0.12", "scipy>=1.14.0"]

[project.scripts]
statadic-studies = "statadic_studies.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff>=0.16,<0.17"]

[tool.uv.sources]
statadic = { workspace = true }
statadic-evidence = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/statadic_studies"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
