[project]
name = "statadic-performance"
version = "0.1.0"
description = "Internal reproducible CPU performance and memory evidence"
requires-python = ">=3.13,<3.14"
dependencies = [
  "statadic", "statadic-evidence", "numpy>=2,<3", "jax[cpu]>=0.11,<0.12",
  "scipy>=1.14", "statsmodels>=0.14,<0.15", "scikit-learn>=1.5,<2",
  "libpysal>=4.12,<5", "spreg>=1.8,<2",
]

[project.scripts]
statadic-performance = "statadic_performance.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff>=0.16,<0.17"]

[tool.uv.sources]
statadic = { workspace = true }
statadic-evidence = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/statadic_performance"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
