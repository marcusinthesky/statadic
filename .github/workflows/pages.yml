name: GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      pages: read
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: '1'
      JAX_ENABLE_COMPILATION_CACHE: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - name: Read Pages configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Prepare runner capacity
        run: bash infra/nix/ci-capacity.sh prepare
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a
      - name: Restore tool downloads
        id: tools-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/uv
            ~/.cache/tectonic
            ~/.cache/mathlib
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/uv.lock', '**/*.py.lock', '**/lake-manifest.json') }}-pages
          restore-keys: |
            tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/uv.lock', '**/*.py.lock', '**/lake-manifest.json') }}-
      - name: Install matching devenv
        run: bash infra/nix/install-devenv.sh
      - name: Prepare locked Python and Lean dependencies
        run: |
          set -o pipefail
          devenv shell -- just python::setup 2>&1 | tee build/ci/pages-python-setup.log
          devenv shell -- just lean::setup 2>&1 | tee build/ci/pages-lean-setup.log
      - name: Save prepared tool downloads
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/uv
            ~/.cache/tectonic
            ~/.cache/mathlib
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Build strict documentation, proofs and lab snapshots
        env:
          STATADIC_DOCS_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -o pipefail
          devenv shell -- just python::docs::build 2>&1 | tee build/ci/pages-build.log
          test -s src/python/apps/docs/build/html/index.html
          test -s src/python/apps/docs/build/html/build-provenance.json
          touch src/python/apps/docs/build/html/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: src/python/apps/docs/build/html
          retention-days: 7
      - name: Final capacity
        if: always()
        run: bash infra/nix/ci-capacity.sh diagnose pages-final
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-diagnostics
          path: |
            build/ci/
            src/lean/build/certification.json
          retention-days: 7
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
