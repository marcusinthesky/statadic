name: CI
'on':
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
env:
  JAX_ENABLE_COMPILATION_CACHE: 'false'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    name: Workspace early regressions (${{ matrix.runner }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      STATADIC_CI_MEMORY_BOUNDED: '1'
      STATADIC_CI_SEED: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - uses: ./.github/actions/python-ci-setup
      - name: Replay current numerical regressions
        run: bash infra/nix/ci-capacity.sh run regressions devenv shell --profile python-ci -- just python::studies::ci-regressions
      - name: Retain early diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-regression-diagnostics-${{ matrix.runner }}
          overwrite: true
          path: build/ci/
          retention-days: 7
  check-nontest:
    name: Non-test checks (${{ matrix.runner }})
    timeout-minutes: 90
    needs: regressions
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: '1'
      STATADIC_CI_MEMORY_BOUNDED: '1'
      STATADIC_CI_SEED: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - run: bash infra/nix/ci-capacity.sh prepare
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a
      - id: tools-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/uv
            ~/.cache/tectonic
            ~/.cache/mathlib
          key: tools-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/uv.lock', '**/*.py.lock', '**/lake-manifest.json', 'infra/release/check_offline_install.py')
            }}-check
          restore-keys: |
            tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/uv.lock', '**/*.py.lock', '**/lake-manifest.json') }}-
      - run: bash infra/nix/install-devenv.sh
      - run: devenv shell -- just setup
      - name: Prepare isolated wheel installation inputs
        run: bash infra/nix/ci-capacity.sh run offline-install devenv shell -- env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run
          --project src/python --offline --frozen --all-packages python infra/release/check_offline_install.py --prepare --output build/ci/offline-install
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/uv
            ~/.cache/tectonic
            ~/.cache/mathlib
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Run non-test checks
        run: bash infra/nix/ci-capacity.sh run check-nontest devenv shell -- just check-ci-nontest
      - name: Final capacity
        if: always()
        run: bash infra/nix/ci-capacity.sh diagnose final
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: non-test-diagnostics-${{ runner.arch }}
          overwrite: true
          path: build/ci/
          retention-days: 7
  check-nontest-arm:
    # Keep the former matrix status available for existing branch protection.
    name: Non-test checks (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    if: always()
    needs: check-nontest
    steps:
      - name: Require shared workspace validation
        env:
          WORKSPACE_RESULT: ${{ needs.check-nontest.result }}
        run: |
          if [[ "$WORKSPACE_RESULT" != success ]]; then
            echo "Shared workspace validation did not pass: $WORKSPACE_RESULT" >&2
            exit 1
          fi
  check:
    name: check (${{ matrix.runner }})
    timeout-minutes: 30
    if: always()
    needs:
      - check-nontest
      - package
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      STATADIC_CI_SEED: ${{ github.sha }}
    steps:
      - name: Require every validation component
        env:
          DEPENDENCY_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -ra results <<< "$DEPENDENCY_RESULTS"
          for result in "${results[@]}"; do
            if [[ "$result" != success ]]; then
              echo "A required validation component did not pass: $result" >&2
              exit 1
            fi
          done
  reference-validation:
    name: Reference validation (${{ matrix.runner }})
    # Preserve required status names; installed-wheel validation owns execution.
    if: always()
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Require installed reference validation on both architectures
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          if [[ "$PACKAGE_RESULT" != success ]]; then
            echo "Installed package validation did not pass: $PACKAGE_RESULT" >&2
            exit 1
          fi
  package:
    name: Package validation
    uses: ./.github/workflows/package-validation.yml
