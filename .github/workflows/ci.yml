name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - name: Prepare runner capacity
        run: bash infra/nix/ci-capacity.sh prepare
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'infra/nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/uv
            ~/.cache/tectonic
            ~/.cache/mathlib
            ~/.bun/install/cache
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/uv.lock', '**/*.py.lock', '**/bun.lock', '**/lake-manifest.json') }}
      - name: Install matching devenv
        run: bash infra/nix/install-devenv.sh
      - name: Prepare dependencies
        run: |
          set -o pipefail
          devenv shell -- just setup 2>&1 | tee build/ci/setup.log
          bash infra/nix/ci-capacity.sh diagnose provisioned
      - name: Validate
        run: |
          set -o pipefail
          devenv shell -- just check 2>&1 | tee build/ci/check.log
      - name: Final capacity
        if: always()
        run: bash infra/nix/ci-capacity.sh diagnose final
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-${{ runner.arch }}
          path: |
            build/ci/
            src/python/apps/docs/build/html/
            src/lean/build/certification.json
          retention-days: 0

  reference-validation:
    name: Reference validation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - name: Prepare runner capacity
        run: bash infra/nix/ci-capacity.sh prepare
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a
        with:
          primary-key: nix-reference-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'infra/nix/**') }}
          restore-prefixes-first-match: nix-reference-${{ runner.arch }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: reference-${{ runner.arch }}-${{ hashFiles('src/python/uv.lock') }}
      - name: Install matching devenv
        run: bash infra/nix/install-devenv.sh
      - name: Prepare locked reference environment
        run: |
          set -o pipefail
          devenv shell -- just setup-references 2>&1 | tee build/ci/reference-setup.log
      - name: Validate live references and precision
        id: validate_references
        run: |
          set -o pipefail
          devenv shell -- just validate-references 2>&1 | tee build/ci/reference-validation.log
      - name: Retain reference evidence
        if: always() && (steps.validate_references.outcome == 'success' || steps.validate_references.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-validation-${{ runner.arch }}
          path: build/reference-validation/
          if-no-files-found: error
          retention-days: 30
      - name: Final capacity
        if: always()
        run: bash infra/nix/ci-capacity.sh diagnose reference-final
      - name: Retain reference diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-diagnostics-${{ runner.arch }}
          path: build/ci/
          retention-days: 30
